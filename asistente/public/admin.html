<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Administrar el asistente</title>
<style>
  :root { --bg: #fff4ea; --ink: #3b3a4a; --muted: #7b7a8c; --red: #e8505b; --soft: #ffe0e2; --line: #e9dccd; --ok: #2f9e55; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, 'Segoe UI', sans-serif; }
  .wrap { width: min(900px, 100% - 24px); margin: 0 auto; padding: 18px 0 60px; }
  h1 { margin: 0; font-size: 22px; color: var(--red); } h2 { font-size: 17px; margin: 22px 0 8px; }
  .top { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  button, .btn { font: inherit; cursor: pointer; padding: 8px 14px; border: 2px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; }
  button:hover { border-color: var(--red); }
  button.on, button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.danger { color: var(--red); } button.small { padding: 4px 10px; font-size: 13px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .card.off { opacity: .55; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 160px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], textarea, select { width: 100%; padding: 9px 12px; border: 2px solid var(--line); border-radius: 12px; font: inherit; background: #fff; color: var(--ink); }
  textarea { min-height: 90px; resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 8px 0; } .check input { width: 18px; height: 18px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--red); font-size: 12px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; } .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--red); font-weight: 600; }
  .msg { white-space: pre-wrap; padding: 8px 12px; border-radius: 12px; margin: 6px 0; max-width: 85%; }
  .msg.u { background: var(--soft); margin-left: auto; } .msg.a { background: #f4f1ec; }
  .login { max-width: 360px; margin: 14vh auto 0; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 9; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="admin.js"></script>
</body>
</html>
