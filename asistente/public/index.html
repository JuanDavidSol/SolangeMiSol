<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente de Snoopy 🐶</title>
<meta name="theme-color" content="#fff4ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff4ea; --ink: #3b3a4a; --muted: #7b7a8c; --red: #e8505b; --sky: #bfe3f7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 0, #fff 0, var(--bg) 45%); color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; }
  .wrap { width: min(760px, 100% - 24px); margin: 0 auto; padding: 18px 0 40px; }
  .back { color: var(--red); font-weight: 600; text-decoration: none; }
  header { display: flex; align-items: center; gap: 14px; margin: 14px 0 18px; }
  .mascot { width: 64px; height: 64px; border-radius: 50%; background: var(--sky); font-size: 40px; display: grid; place-items: center; }
  h1 { margin: 0; font: 400 clamp(28px, 7vw, 40px)/1.1 'Pacifico', cursive; color: var(--red); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .note { margin: 14px 4px 0; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../juegos.html">← Volver a los juegos</a>
  <header>
    <div class="mascot" aria-hidden="true">🐶</div>
    <div><h1>Pregúntale a Snoopy</h1><p>Dudas sobre los juegos, las galletas, los premios y los vales.</p></div>
  </header>
  <div id="chat-root"></div>
  <p class="note">Soy un asistente virtual y respondo con la información de esta web. No guardo tu nombre ni tus datos personales.</p>
</div>
<script src="chat.js" data-mode="page"></script>
</body>
</html>
